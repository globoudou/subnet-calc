name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Numéro de version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: Tests unitaires et APK signé
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "subnet-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: subnet-apk
          path: subnet-*.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: subnet-*.apk
          generate_release_notes: true
